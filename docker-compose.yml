version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: zendora
      POSTGRES_USER: zendora
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://zendora:dev_password@db:5432/zendora
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.placeholder}
      SENDGRID_FROM_EMAIL: noreply@zendora.com
      THIRD_PARTY_AUTH_URL: ${THIRD_PARTY_AUTH_URL:-https://partner.com/verify}
      THIRD_PARTY_AUTH_TOKEN: ${THIRD_PARTY_AUTH_TOKEN:-}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://zendora:dev_password@db:5432/zendora
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.placeholder}
      SENDGRID_FROM_EMAIL: noreply@zendora.com
      THIRD_PARTY_AUTH_URL: ${THIRD_PARTY_AUTH_URL:-https://partner.com/verify}
      THIRD_PARTY_AUTH_TOKEN: ${THIRD_PARTY_AUTH_TOKEN:-}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.core.celery_app worker --loglevel=info

  celery_beat:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://zendora:dev_password@db:5432/zendora
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.placeholder}
      SENDGRID_FROM_EMAIL: noreply@zendora.com
      THIRD_PARTY_AUTH_URL: ${THIRD_PARTY_AUTH_URL:-https://partner.com/verify}
      THIRD_PARTY_AUTH_TOKEN: ${THIRD_PARTY_AUTH_TOKEN:-}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.core.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
