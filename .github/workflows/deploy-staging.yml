name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGE_SERVER_IP }}
          username: ${{ secrets.STAGE_SERVER_GITHUB_USERNAME }}
          key: ${{ secrets.STAGE_SERVER_GITHUB_SSHKEY }}
          port: 22
          debug: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/srv/sites/zendora"
            echo "Deploying in $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            dump_status() {
              echo "===== docker compose ps ====="
              docker compose ps -a || true
              echo "===== redis logs ====="
              docker compose logs --tail=100 redis || true
              echo "===== db logs ====="
              docker compose logs --tail=50 db || true
              echo "===== api logs ====="
              docker compose logs --tail=100 api || true
            }
            trap dump_status ERR

            echo "Stopping services..."
            docker compose down
            docker volume rm zendora_redis_data 2>/dev/null || true

            echo "Updating code..."
            git fetch origin develop
            git reset --hard origin/develop
            git log -1 --oneline

            echo "Starting services..."
            docker compose up --build -d --force-recreate

            echo "Waiting for API health..."
            healthy=0
            for i in $(seq 1 30); do
              if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()" >/dev/null 2>&1; then
                echo "API is healthy"
                healthy=1
                break
              fi
              echo "Waiting ($i/30)..."
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              echo "API did not become healthy"
              exit 1
            fi

            echo "Running migrations..."
            docker compose exec -T api alembic upgrade head

            echo "Health check:"
            docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode())"
